 <div *appRole="'Admin'" class="mb-10">
      <h2 class="text-2xl mb-6 font-semibold text-blue-600">Admin Users</h2>
      <div class="flex flex-wrap -mx-3">
        @for (item of admin; track item.id) {
          <div class="w-full md:w-1/3 px-3 mb-6">
            <p-card class="bg-blue-50 border-l-4 border-blue-400 hover:shadow-xl transition-transform transform hover:-translate-y-1 duration-300 rounded-lg p-4">
              <ng-template pTemplate="title">
                <span class="text-blue-800 font-semibold">{{ item.name }}</span>
              </ng-template>
              <ng-template pTemplate="content">
                <p><strong>Email:</strong> {{ item.email }}</p>
                <p><strong>Username:</strong> {{ item.username }}</p>       
                <p><strong>Phone:</strong> {{ item.phone }}</p>
              </ng-template>
            </p-card>
          </div>
        }
      </div>
    </div>
