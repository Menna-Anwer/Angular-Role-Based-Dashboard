<div class="flex flex-col items-center justify-center h-screen bg-gray-100">

    <div class="bg-white shadow-xl p-10 rounded-xl w-96">

        <h1 class="text-3xl font-bold text-center mb-6 text-blue-700">
            Select Your Role
        </h1>

        <div class="flex flex-col gap-3">
            @for (role of roles; track $index) {
            <div class="flex items-center gap-2">
                <p-radioButton name="roles" [value]="role.name" [(ngModel)]="selectedRole">
                </p-radioButton>
                <label>{{ role.name }}</label>
            </div>
            }
        </div>

        <button pButton type="button" label="Enter Dashboard" class="w-full mt-6" (click)="submit()"
            [disabled]="!selectedRole">
        </button>

    </div>

</div>
